# ============================================================================
# Higgs Audio v3 TTS — docker-compose.deploy.yml
# ============================================================================
# Деплой на homeserver. Образ пуллится из ghcr.io.
# Watchtower автоматически обновляет контейнер при появлении нового образа.
#
# Доступ: https://higgs.local (через Traefik)
# ============================================================================

services:
  higgs-tts:
    image: ghcr.io/fan92rus/higgs-tts:latest
    container_name: higgs-tts
    volumes:
      - higgs-models:/app/models
      - higgs-outputs:/app/outputs
      - higgs-cache:/app/.cache
    environment:
      - HIGGS_MODE=${HIGGS_MODE:-auto}
      - HIGGS_IDLE_UNLOAD_SEC=${HIGGS_IDLE_UNLOAD_SEC:-1800}
      - HIGGS_HOST=0.0.0.0
      - HIGGS_PORT=7861
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7861/api/state"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.higgs.rule=Host(`higgs.local`)"
      - "traefik.http.routers.higgs.entrypoints=websecure"
      - "traefik.http.routers.higgs.tls.certresolver=stepca"
      - "traefik.http.services.higgs.loadbalancer.server.port=7861"
    networks:
      - default
      - proxy

volumes:
  higgs-models:
    external: true
  higgs-outputs:
    external: true
  higgs-cache:
    external: true

networks:
  proxy:
    external: true
