# ============================================================================
# Higgs Audio v3 TTS — docker-compose.deploy.yml
# ============================================================================
# Деплой на homeserver (192.168.1.96). Сборка из локального контекста.
# CI копирует код в /opt/higgs-tts/ и запускает docker compose up -d --build.
#
# Доступ: https://higgs.local (через Traefik)
# ============================================================================

services:
  higgs-tts:
    build:
      context: /opt/higgs-tts
      dockerfile: Dockerfile
    image: higgs-tts:latest
    container_name: higgs-tts
    volumes:
      - higgs-models:/app/models
      - higgs-outputs:/app/outputs
      - higgs-cache:/app/.cache
      - /opt/higgs-tts/voices:/app/voices:ro
    environment:
      - HIGGS_MODE=${HIGGS_MODE:-auto}
      - HIGGS_HOST=0.0.0.0
      - HIGGS_PORT=7861
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7861/api/state"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.higgs.rule=Host(`higgs.local`)"
      - "traefik.http.routers.higgs.entrypoints=websecure"
      - "traefik.http.routers.higgs.tls.certresolver=stepca"
      - "traefik.http.services.higgs.loadbalancer.server.port=7861"
    networks:
      - default
      - proxy

volumes:
  higgs-models:
    external: true
  higgs-outputs:
    external: true
  higgs-cache:
    external: true

networks:
  proxy:
    external: true
